server:
  port: 8080

spring:
  application:
    name: orchestrator-service
  datasource:
    url: ${ORCHESTRATOR_DB_URL:jdbc:postgresql://localhost:5432/agentic}
    username: ${ORCHESTRATOR_DB_USERNAME:agentic}
    password: ${ORCHESTRATOR_DB_PASSWORD:agentic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orchestrator
  flyway:
    enabled: true
    schemas: orchestrator
    default-schema: orchestrator
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

orchestrator:
  # Bounded worker pool used for parallel task execution (single instance).
  core-pool-size: 4
  max-pool-size: 8
  queue-capacity: 100
  scheduler-enabled: true
  poll-interval-ms: 500
  governance:
    # Human approval gates enforced by the scheduler. Swagger is the operator UI.
    approval-gates: PRE_IMPLEMENTATION,FINAL
    # Bounded agent/task attempts (retries = max-task-attempts - 1).
    # This is NOT the engine's optimistic-locking retry, which is unbounded-safe
    # and never counted as an agent retry.
    max-task-attempts: 3
    # Autonomy boundaries: exceeding either safe-stops the run with audit evidence.
    max-workflow-duration: PT10M
    task-timeout: PT2M
    # Root of runs/{workflowId}/workspace and runs/{workflowId}/snapshots.
    workspace-root: runs