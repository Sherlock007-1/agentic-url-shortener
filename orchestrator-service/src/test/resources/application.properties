# Tests drive workflows explicitly (start API + completion chaining) so that the
# background poller of one cached Spring context cannot interfere with another
# context's workflows. WorkflowSchedulerIntegrationTest re-enables it on purpose.
orchestrator.scheduler-enabled=false

# Approval gates are a production default (see application.yml). The orchestration
# core tests assert un-gated end-to-end execution, so gating is off unless a test
# switches it on explicitly with @TestPropertySource.
orchestrator.governance.approval-gates=

# Snapshots/workspaces created by tests must never touch the repository directory.
orchestrator.governance.workspace-root=${java.io.tmpdir}/agentic-orchestrator-test-runs